<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>工业级 CAD 电梯机械架构仿真</title>
    <style>
        :root {
            --floor-h: 120px;
            --ind-yellow: #f1c40f; 
            --iron-grey: #34495e;
            --steel-blue: #2c3e50;
            --brushed-steel: linear-gradient(180deg, #bdc3c7 0%, #ffffff 50%, #bdc3c7 100%);
        }

        body {
            margin: 0; background: #0e1012; color: #fff;
            font-family: 'Consolas', 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden;
        }

        .app-container { display: flex; gap: 40px; align-items: center; perspective: 2500px; }

        /* === 3D 井道容器 === */
        .scene-3d {
            width: 360px; height: 760px; position: relative;
            transform-style: preserve-3d; transform: rotateY(-18deg) rotateX(5deg);
        }

        .shaft {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
            border: 2px solid #2c3e50; background: rgba(20, 24, 28, 0.8);
        }

        /* 工业 T 型导轨 */
        .rail { 
            position: absolute; width: 12px; height: 100%; 
            background: #444; left: 8px; transform: translateZ(20px);
            border-left: 2px solid #222; box-shadow: 2px 0 5px #000;
        }
        .rail.right { left: auto; right: 8px; }

        /* 每层楼的厅门门头机械横梁 */
        .landing-header {
            position: absolute; width: 100%; height: 25px;
            background: linear-gradient(to bottom, #222, #444);
            border-bottom: 2px solid var(--ind-yellow);
            transform: translateZ(60px); opacity: 0.8;
            display: flex; align-items: flex-end; justify-content: center;
            font-size: 10px; color: #666;
        }

        /* 机房机械组 */
        .machine-room { 
            position: absolute; top: -90px; width: 100%; height: 90px; 
            background: #1a1a1a; border: 2px solid #333; transform: translateZ(40px); 
        }
        .traction-motor {
            position: absolute; width: 80px; height: 50px; background: #1a5276;
            left: 50%; top: 10px; transform: translateX(-50%); border-radius: 4px;
        }
        .main-sheave { 
            position: absolute; width: 56px; height: 56px; border-radius: 50%; 
            background: repeating-conic-gradient(#555 0deg 30deg, #333 30deg 60deg);
            top: 15px; left: 50px; border: 5px solid #111;
        }
        .governor { /* 限速器 */
            position: absolute; width: 25px; height: 25px; border-radius: 50%;
            background: #c0392b; top: 30px; right: 40px; border: 2px solid #000;
        }

        /* 多路曳引钢丝绳 */
        .cables-group { position: absolute; width: 100%; height: 100%; transform: translateZ(30px); }
        .rope { position: absolute; width: 2px; height: 100%; background: #666; top: 0; }

        /* === 龙门架结构（Car Sling） === */
        .elevator-group {
            position: absolute; bottom: 0; left: 55px; width: 210px; height: 115px;
            transform-style: preserve-3d; transition: bottom 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sling-beam { /* 上梁与底梁 */
            position: absolute; width: 226px; height: 12px; left: -8px;
            background: #222; border: 1px solid var(--ind-yellow);
            transform: translateZ(55px);
        }
        .s-top { top: -12px; }
        .s-bottom { bottom: -12px; }
        
        .sling-upright { /* 侧立柱 */
            position: absolute; width: 10px; height: 140px; top: -12px;
            background: var(--ind-yellow); transform: translateZ(55px);
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.3);
        }
        .u-left { left: -8px; } .u-right { right: -8px; }

        /* 轿厢内部（高亮版） */
        .car-box { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }
        .face { position: absolute; border: 1px solid #aaa; box-sizing: border-box; }
        .f-back { 
            width: 100%; height: 100%; transform: translateZ(-70px);
            background: var(--brushed-steel); box-shadow: inset 0 0 40px rgba(255,255,255,1);
        }
        .f-left, .f-right { 
            width: 125px; height: 100%; 
            background: radial-gradient(circle at center, #fff, #bdc3c7);
        }
        .f-left { transform: rotateY(-90deg) translateZ(62px); }
        .f-right { transform: rotateY(90deg) translateZ(148px); }
        .f-top { 
            width: 100%; height: 125px; transform: rotateX(90deg) translateZ(62px);
            background: #fff; box-shadow: 0 0 50px #fff;
        }
        .f-bottom { 
            width: 100%; height: 125px; transform: rotateX(-90deg) translateZ(53px);
            background: #34495e;
        }
        .f-front { width: 100%; height: 100%; transform: translateZ(55px); pointer-events: none; border: 2px solid #666; }

        /* 层门/轿门 */
        .door-container { position: absolute; width: 100%; height: 100%; overflow: hidden; display: flex; transform: translateZ(1px); }
        .door-leaf { width: 50%; height: 100%; background: linear-gradient(90deg, #95a5a6, #eee, #95a5a6); border: 1px solid #7f8c8d; transition: transform 1.2s ease-in-out; }
        .doors-open .door-left { transform: translateX(-100%); }
        .doors-open .door-right { transform: translateX(100%); }

        /* === 工业级对重框架 === */
        .cw-frame { 
            position: absolute; top: 0; right: 20px; width: 30px; height: 140px; 
            border: 3px solid #555; transform: translateZ(-20px); transition: top 2.5s;
            background: rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; padding: 2px;
        }
        .weight-block { width: 100%; height: 10px; background: #222; margin-bottom: 2px; border-bottom: 1px solid #444; }

        /* 底坑缓冲器 */
        .pitted-buffer {
            position: absolute; bottom: 0; width: 24px; height: 35px; background: #c0392b;
            left: 80px; border-radius: 5px 5px 0 0; transform: translateZ(20px);
            background: repeating-linear-gradient(0deg, #c0392b, #c0392b 4px, #e74c3c 4px, #e74c3c 8px);
        }

        /* UI Panel */
        .panel { background: #1c1f22; padding: 20px; border-radius: 4px; border: 1px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .led { background: #000; color: #00ff00; font-size: 28px; text-align: center; margin-bottom: 15px; border: 1px solid #333; font-family: 'Digital-7', monospace; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { width: 45px; height: 45px; cursor: pointer; background: #2c3e50; color: #bdc3c7; border: 1px solid #444; font-size: 14px; }
        button:hover { background: #34495e; color: #fff; }
        button.active { border-color: var(--ind-yellow); color: var(--ind-yellow); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="panel" id="outUI"></div>

    <div class="scene-3d">
        <div class="shaft" id="shaftBG">
            <div class="rail"></div><div class="rail right"></div>
            
            <div class="machine-room">
                <div class="traction-motor"></div>
                <div class="main-sheave"></div>
                <div class="governor"></div>
            </div>

            <div class="cables-group">
                <div class="rope" style="left:70px"></div>
                <div class="rope" style="left:75px"></div>
                <div class="rope" style="left:80px"></div>
            </div>

            <div class="elevator-group" id="elv">
                <div class="sling-beam s-top"></div>
                <div class="sling-upright u-left"></div>
                <div class="sling-upright u-right"></div>
                <div class="sling-beam s-bottom"></div>

                <div class="car-box">
                    <div class="face f-back"></div>
                    <div class="face f-left"></div>
                    <div class="face f-right"></div>
                    <div class="face f-top"></div>
                    <div class="face f-bottom"></div>
                    <div class="face f-front">
                        <div class="door-container" id="doorContainer">
                            <div class="door-leaf door-left"></div>
                            <div class="door-leaf door-right"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cw-frame" id="cw">
                <div class="weight-block"></div><div class="weight-block"></div>
                <div class="weight-block"></div><div class="weight-block"></div>
                <div class="weight-block"></div><div class="weight-block"></div>
                <div class="weight-block"></div><div class="weight-block"></div>
            </div>

            <div class="pitted-buffer"></div>
            <div class="pitted-buffer" style="left:auto; right:80px;"></div>
        </div>
    </div>

    <div class="panel">
        <div class="led" id="led">1</div>
        <div class="btn-grid" id="inUI"></div>
    </div>
</div>

<script>
    const elv = document.getElementById('elv');
    const cw = document.getElementById('cw');
    const led = document.getElementById('led');
    const doors = document.getElementById('doorContainer');
    const shaft = document.getElementById('shaftBG');
    let cur = 1, moving = false;

    function init() {
        const out = document.getElementById('outUI');
        const ins = document.getElementById('inUI');
        
        // 动态生成层门门头和按钮
        for(let i=1; i<=6; i++) {
            const floorPos = (i-1) * 120;
            // 插入井道机械横梁
            shaft.insertAdjacentHTML('afterbegin', `
                <div class="landing-header" style="bottom:${floorPos + 110}px">
                    FL-${i} HEAD-GEAR UNIT
                </div>
            `);
            
            out.innerHTML = `<div style="height:120px; display:flex; align-items:center;">
                <button onclick="to(${i})" id="outBtn${i}">${i}F</button>
            </div>` + out.innerHTML;
            ins.insertAdjacentHTML('afterbegin', `<button onclick="to(${i})" id="inBtn${i}">${i}</button>`);
        }
    }

    function to(f) {
        if(moving || f === cur) return;
        moving = true;
        doors.classList.remove('doors-open');
        
        // 按钮亮起
        document.getElementById(`inBtn${f}`).classList.add('active');

        // 运动计算
        elv.style.bottom = (f-1)*120 + "px";
        cw.style.top = (f-1)*120 + "px";

        let step = cur;
        const dir = f > cur ? 1 : -1;
        const timer = setInterval(() => {
            if(step !== f) {
                step += dir;
                led.innerText = step;
            } else {
                clearInterval(timer);
                cur = f;
                setTimeout(() => {
                    moving = false;
                    document.getElementById(`inBtn${f}`).classList.remove('active');
                    doors.classList.add('doors-open');
                    setTimeout(() => {
                        if(!moving) doors.classList.remove('doors-open');
                    }, 3500);
                }, 500);
            }
        }, 500);
    }
    init();
</script>
</body>
</html>
