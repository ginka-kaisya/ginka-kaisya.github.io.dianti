<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>工程级 3D 电梯机械系统 - 全空间仿真版</title>
    <style>
        :root {
            --floor-h: 120px;
            --ind-yellow: #f1c40f; 
            --steel-grey: #7f8c8d;
            --rope-color: #95a5a6;
            --shaft-depth: 300px;
        }

        body {
            margin: 0; background: #050608; color: #fff;
            font-family: 'Segoe UI', Consolas, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; perspective: 1500px;
        }

        /* 控制台布局 */
        .main-layout { display: flex; gap: 50px; align-items: center; transform-style: preserve-3d; }

        /* === 3D 场景核心 === */
        .scene-wrap {
            width: 450px; height: 750px; position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-20deg) rotateX(10deg);
            transition: transform 0.5s ease-out;
        }

        .shaft-3d {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
        }

        /* 井道结构壁 */
        .wall {
            position: absolute; background: rgba(15, 18, 22, 0.98);
            border: 1px solid #1a252f; box-shadow: inset 0 0 100px #000;
        }
        .wall-back { width: 100%; height: 100%; transform: translateZ(calc(var(--shaft-depth) * -1 / 2)); }
        .wall-left { width: var(--shaft-depth); height: 100%; transform: rotateY(90deg) translateZ(calc(var(--shaft-depth) * -1 / 2)); }
        .wall-right { width: var(--shaft-depth); height: 100%; transform: rotateY(-90deg) translateZ(calc(450px - var(--shaft-depth) / 2)); }

        /* 立体导轨 (主轨) */
        .rail-3d {
            position: absolute; width: 12px; height: 100%; background: #333;
            left: 30px; transform: translateZ(0); transform-style: preserve-3d;
        }
        .rail-3d::before { /* 轨道侧翼 */
            content: ''; position: absolute; width: 8px; height: 100%; background: #222;
            transform: rotateY(90deg); left: 6px;
        }
        .rail-right { left: auto; right: 30px; }

        /* 对重导轨 (位于背壁) */
        .cw-rail {
            position: absolute; width: 8px; height: 100%; background: #222;
            left: 50%; transform: translateX(-50%) translateZ(calc(var(--shaft-depth) * -1 / 2 + 10px));
        }

        /* === 3D 轿厢组 === */
        .car-system {
            position: absolute; bottom: 0; left: 65px; width: 320px; height: 135px;
            transform-style: preserve-3d; transition: bottom 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 轿顶动滑轮 (2:1 绕绳) */
        .pulley-box {
            position: absolute; top: -45px; width: 100%; display: flex; justify-content: space-around;
            transform: rotateY(90deg); transform-style: preserve-3d;
        }
        .pulley {
            width: 45px; height: 45px; border-radius: 50%; border: 4px solid var(--ind-yellow);
            background: repeating-conic-gradient(#333 0 30deg, #111 30deg 60deg);
        }

        /* 3D 轿体 */
        .car-3d {
            position: absolute; width: 100%; height: 100%; transform-style: preserve-3d;
        }
        .car-face { position: absolute; border: 1px solid #555; box-sizing: border-box; }
        .c-front { width: 100%; height: 100%; transform: translateZ(80px); background: rgba(255,255,255,0.05); }
        .c-back { width: 100%; height: 100%; transform: translateZ(-80px); background: #bdc3c7; box-shadow: inset 0 0 50px #fff; }
        .c-left { width: 160px; height: 100%; transform: rotateY(90deg) translateZ(-80px); background: #ecf0f1; }
        .c-right { width: 160px; height: 100%; transform: rotateY(-90deg) translateZ(-240px); background: #ecf0f1; }
        .c-top { width: 100%; height: 160px; transform: rotateX(90deg) translateZ(80px); background: #fff; box-shadow: 0 0 40px #fff; }
        .c-bottom { width: 100%; height: 160px; transform: rotateX(90deg) translateZ(-55px); background: #2c3e50; }

        /* 轿门立体感 */
        .door-set { position: absolute; width: 100%; height: 100%; display: flex; transform: translateZ(81px); overflow: hidden; }
        .d-leaf { width: 50%; height: 100%; background: linear-gradient(90deg, #7f8c8d, #fff, #7f8c8d); border: 1px solid #34495e; transition: 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .open .d-left { transform: translateX(-100%); }
        .open .d-right { transform: translateX(100%); }

        /* === 3D 对重装置 (3D Counterweight) === */
        .cw-system {
            position: absolute; top: 0; left: 50%; width: 60px; height: 160px;
            transform: translateX(-50%) translateZ(calc(var(--shaft-depth) * -1 / 2 + 20px));
            transform-style: preserve-3d; transition: top 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cw-frame {
            position: absolute; width: 100%; height: 100%; border: 3px solid #555;
            background: rgba(0,0,0,0.8); transform-style: preserve-3d;
        }
        .weight-block-3d {
            width: 100%; height: 12px; background: #222; border: 1px solid #444;
            margin-bottom: 2px; transform: translateZ(5px); box-shadow: 0 2px 5px #000;
        }

        /* 钢丝绳 (SVG 动态模拟) */
        .ropes-svg {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            pointer-events: none; transform: translateZ(0px);
        }

        /* UI */
        .controls {
            display: flex; flex-direction: column; gap: 20px;
        }
        .panel { 
            background: #111; padding: 20px; border: 1px solid #333; 
            border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .screen { background: #000; color: #0f0; font-family: 'Digital-7', Courier; font-size: 32px; text-align: center; padding: 10px; margin-bottom: 15px; border: 1px solid #222; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { width: 50px; height: 50px; background: #2c3e50; color: #fff; border: 1px solid #444; cursor: pointer; font-weight: bold; }
        button.active { border-color: var(--ind-yellow); color: var(--ind-yellow); box-shadow: 0 0 15px var(--ind-yellow); }
        
        .cam-slider { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="controls">
        <div class="panel">
            <div style="font-size: 12px; color: #888; margin-bottom: 5px;">3D VIEW ROTATION</div>
            <input type="range" class="cam-slider" min="-60" max="60" value="-20" oninput="rotateScene(this.value)">
        </div>
        <div class="panel" id="externalCalls"></div>
    </div>

    <div class="scene-wrap" id="scene">
        <div class="shaft-3d">
            <div class="wall wall-back"></div>
            <div class="wall wall-left"></div>
            <div class="wall wall-right"></div>
            
            <div class="rail-3d"></div>
            <div class="rail-3d rail-right"></div>
            <div class="cw-rail"></div>

            <svg class="ropes-svg">
                <line id="ropeL" x1="100" y1="0" x2="100" y2="600" stroke="#777" stroke-width="2" />
                <line id="ropeR" x1="220" y1="0" x2="220" y2="600" stroke="#777" stroke-width="2" />
                <line id="ropeCW" x1="225" y1="0" x2="225" y2="150" stroke="#555" stroke-width="3" />
            </svg>

            <div class="car-system" id="carSys">
                <div class="pulley-box">
                    <div class="pulley"></div>
                    <div class="pulley"></div>
                </div>
                <div class="car-3d" id="carBody">
                    <div class="car-face c-back"></div>
                    <div class="car-face c-left"></div>
                    <div class="car-face c-right"></div>
                    <div class="car-face c-top"></div>
                    <div class="car-face c-bottom"></div>
                    <div class="car-face c-front">
                        <div class="door-set" id="doors">
                            <div class="d-leaf d-left"></div>
                            <div class="d-leaf d-right"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cw-system" id="cwSys">
                <div class="cw-frame">
                    <div class="weight-block-3d"></div><div class="weight-block-3d"></div>
                    <div class="weight-block-3d"></div><div class="weight-block-3d"></div>
                    <div class="weight-block-3d"></div><div class="weight-block-3d"></div>
                    <div class="weight-block-3d"></div><div class="weight-block-3d"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="panel">
            <div class="screen" id="led">1</div>
            <div class="btn-grid" id="internalButtons"></div>
        </div>
    </div>
</div>

<script>
    const carSys = document.getElementById('carSys');
    const cwSys = document.getElementById('cwSys');
    const led = document.getElementById('led');
    const doors = document.getElementById('doors');
    const scene = document.getElementById('scene');
    
    // 绳索逻辑
    const rL = document.getElementById('ropeL');
    const rR = document.getElementById('ropeR');
    const rCW = document.getElementById('ropeCW');

    let curFloor = 1, isMoving = false;

    function init() {
        const ext = document.getElementById('externalCalls');
        const ins = document.getElementById('internalButtons');
        for(let i=1; i<=6; i++) {
            ext.innerHTML = `<button onclick="goTo(${i})">${i}F</button>` + ext.innerHTML;
            ins.insertAdjacentHTML('beforeend', `<button onclick="goTo(${i})" id="btn${i}">${i}</button>`);
        }
        updateRopes(1);
    }

    function rotateScene(val) {
        scene.style.transform = `rotateY(${val}deg) rotateX(10deg)`;
    }

    function updateRopes(floor) {
        const carBottom = (floor-1) * 120;
        const carTopY = 750 - carBottom - 180; // 考虑轿厢高度和滑轮位置
        const cwTopY = carBottom + 20; // 对重与轿厢反向运动

        rL.setAttribute('y2', carTopY);
        rR.setAttribute('y2', carTopY);
        rCW.setAttribute('y2', cwTopY);
    }

    function goTo(f) {
        if(isMoving || f === curFloor) return;
        isMoving = true;
        doors.classList.remove('open');
        document.getElementById(`btn${f}`).classList.add('active');

        // 运动执行
        carSys.style.bottom = (f-1) * 120 + "px";
        cwSys.style.top = (f-1) * 120 + "px";
        
        // 动态更新绳索
        let startPos = (curFloor-1) * 120;
        let targetPos = (f-1) * 120;
        let startTime = null;

        function animateRopes(timestamp) {
            if (!startTime) startTime = timestamp;
            let progress = (timestamp - startTime) / 2500; // 2.5s duration
            if (progress > 1) progress = 1;

            const currentFloorSim = curFloor + (f - curFloor) * progress;
            updateRopes(currentFloorSim);

            if (progress < 1) requestAnimationFrame(animateRopes);
        }
        requestAnimationFrame(animateRopes);

        // 楼层显示逻辑
        let step = curFloor;
        const dir = f > curFloor ? 1 : -1;
        const timer = setInterval(() => {
            if(step !== f) {
                step += dir;
                led.innerText = step;
            } else {
                clearInterval(timer);
                curFloor = f;
                setTimeout(() => {
                    isMoving = false;
                    document.getElementById(`btn${f}`).classList.remove('active');
                    doors.classList.add('open');
                }, 600);
            }
        }, 450);
    }

    init();
</script>
</body>
</html>
