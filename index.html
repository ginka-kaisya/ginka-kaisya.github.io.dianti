<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 工业级机械架构仿真 - 深度建模版</title>
    <style>
        :root {
            --floor-h: 120px;
            --ind-yellow: #f1c40f; 
            --iron-grey: #34495e;
            --deep-shaft: #080a0c;
            --brushed-steel: linear-gradient(180deg, #bdc3c7 0%, #ffffff 50%, #bdc3c7 100%);
        }

        body {
            margin: 0; background: #050607; color: #fff;
            font-family: 'Consolas', 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden; perspective: 2000px;
        }

        .app-container { display: flex; gap: 80px; align-items: center; transform-style: preserve-3d; }

        /* === 3D 井道核心 === */
        .shaft-3d {
            width: 400px; height: 750px; position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-25deg) rotateX(10deg);
            transition: transform 0.8s ease-out;
        }
        .shaft-3d:hover { transform: rotateY(-10deg) rotateX(5deg); }

        /* 井道壁 */
        .shaft-wall {
            position: absolute; width: 100%; height: 100%;
            background: rgba(20, 24, 28, 0.95); border: 1px solid #1a252f;
        }
        .wall-back { transform: translateZ(-150px); background: linear-gradient(#0a0c0e, #14181b); }
        .wall-left { width: 300px; transform: rotateY(90deg) translateZ(-150px); background: #0c0e10; }
        .wall-right { width: 300px; transform: rotateY(-90deg) translateZ(-250px); background: #0c0e10; }

        /* 立体 T 型导轨 */
        .rail-3d {
            position: absolute; width: 12px; height: 100%;
            left: 20px; transform: translateZ(-10px);
            background: #444; border-left: 2px solid #222;
            transform-style: preserve-3d;
        }
        .rail-3d::after { /* 导轨侧面 */
            content: ''; position: absolute; width: 10px; height: 100%;
            background: #222; transform: rotateY(90deg); transform-origin: left;
        }
        .rail-right { left: auto; right: 20px; }

        /* 导轨立体支架 */
        .bracket-3d {
            position: absolute; width: 40px; height: 6px; background: #111;
            left: -10px; transform: rotateX(90deg) translateZ(0);
            border: 1px solid #333;
        }

        /* 机房机械组 */
        .machine-room {
            position: absolute; top: -110px; width: 440px; left: -20px; height: 110px;
            background: #111; border: 2px solid #333; transform-style: preserve-3d;
            transform: translateZ(-50px);
        }
        .main-pulley {
            position: absolute; width: 70px; height: 70px; border-radius: 50%;
            background: conic-gradient(#666 0 45deg, #111 45deg 90deg, #666 90deg 135deg, #111 135deg 180deg, #666 180deg 225deg, #111 225deg 270deg, #666 270deg 315deg, #111 315deg 360deg);
            top: 20px; left: 60px; border: 6px solid #000; transition: transform 0.5s linear;
        }

        /* === 3D 轿厢系统 === */
        .car-group {
            position: absolute; bottom: 0; left: 60px; width: 280px; height: 130px;
            transform-style: preserve-3d; transition: bottom 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 轿顶轮组 (Top Sheaves) */
        .top-pulley {
            position: absolute; width: 40px; height: 40px; border-radius: 50%;
            background: #222; border: 3px solid var(--ind-yellow);
            top: -45px; transform: rotateY(90deg);
        }
        .pulley-l { left: 40px; } .pulley-r { right: 40px; }

        /* 龙门架立体结构 */
        .sling-upright {
            position: absolute; width: 14px; height: 170px; top: -20px;
            background: var(--ind-yellow); transform: translateZ(60px);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        .u-left { left: 10px; } .u-right { right: 10px; }

        /* 轿厢主体 3D 渲染 */
        .car-body {
            position: absolute; width: 240px; height: 100%; left: 20px;
            transform-style: preserve-3d; transform: translateZ(0);
        }
        .face { position: absolute; border: 1px solid #aaa; }
        .f-front { width: 100%; height: 100%; transform: translateZ(80px); background: rgba(255,255,255,0.05); border: 2px solid #444; }
        .f-back { width: 100%; height: 100%; transform: translateZ(-80px); background: var(--brushed-steel); box-shadow: inset 0 0 50px #fff; }
        .f-left { width: 160px; height: 100%; transform: rotateY(90deg) translateZ(-80px); background: #eee; }
        .f-right { width: 160px; height: 100%; transform: rotateY(-90deg) translateZ(-160px); background: #eee; }
        .f-top { width: 100%; height: 160px; transform: rotateX(90deg) translateZ(80px); background: #fff; box-shadow: 0 0 40px #fff; }
        .f-bottom { width: 100%; height: 160px; transform: rotateX(90deg) translateZ(-50px); background: #34495e; }

        /* 门系统 */
        .door-gate { position: absolute; width: 100%; height: 100%; overflow: hidden; display: flex; transform: translateZ(81px); }
        .leaf { width: 50%; height: 100%; background: linear-gradient(90deg, #95a5a6, #fff, #95a5a6); border: 1px solid #7f8c8d; transition: transform 1.2s; }
        .open .l-leaf { transform: translateX(-100%); }
        .open .r-leaf { transform: translateX(100%); }

        /* 3D 弹簧缓冲器 (Pit Buffers) */
        .buffer-3d {
            position: absolute; bottom: 10px; width: 40px; height: 50px;
            left: 100px; transform-style: preserve-3d;
        }
        .spring-coil {
            width: 100%; height: 8px; background: #c0392b; border-radius: 20px;
            margin-bottom: 2px; border: 1px solid #000;
        }

        /* UI Panel */
        .panel { background: #1a1c1e; padding: 25px; border: 1px solid #333; box-shadow: 0 20px 50px #000; transform: translateZ(100px); }
        .led { background: #000; color: #00ff00; font-size: 32px; text-align: center; margin-bottom: 15px; font-family: 'Digital-7', 'Courier New'; padding: 5px; }
        button { width: 50px; height: 50px; background: #2c3e50; color: #fff; border: 1px solid #444; margin: 4px; cursor: pointer; }
        button.active { border-color: var(--ind-yellow); color: var(--ind-yellow); box-shadow: 0 0 15px var(--ind-yellow); }

    </style>
</head>
<body>

<div class="app-container">
    <div class="panel" id="outUI"></div>

    <div class="shaft-3d">
        <div class="shaft-wall wall-back"></div>
        <div class="shaft-wall wall-left"></div>
        <div class="shaft-wall wall-right"></div>

        <div class="rail-3d" id="railL"></div>
        <div class="rail-3d rail-right" id="railR"></div>

        <div class="machine-room">
            <div class="main-pulley" id="mainWhl"></div>
        </div>

        <div class="car-group" id="elv">
            <div class="top-pulley pulley-l"></div>
            <div class="top-pulley pulley-r"></div>
            
            <div class="sling-upright u-left"></div>
            <div class="sling-upright u-right"></div>

            <div class="car-body">
                <div class="face f-back"></div>
                <div class="face f-left"></div>
                <div class="face f-right"></div>
                <div class="face f-top"></div>
                <div class="face f-bottom"></div>
                <div class="face f-front">
                    <div class="door-gate" id="gate">
                        <div class="leaf l-leaf"></div>
                        <div class="leaf r-leaf"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="buffer-3d">
            <div class="spring-coil"></div><div class="spring-coil"></div><div class="spring-coil"></div><div class="spring-coil"></div>
        </div>
        <div class="buffer-3d" style="left:auto; right:100px;">
            <div class="spring-coil"></div><div class="spring-coil"></div><div class="spring-coil"></div><div class="spring-coil"></div>
        </div>
    </div>

    <div class="panel">
        <div class="led" id="led">1</div>
        <div id="inUI" style="display: grid; grid-template-columns: 1fr 1fr;"></div>
    </div>
</div>

<script>
    const elv = document.getElementById('elv');
    const gate = document.getElementById('gate');
    const led = document.getElementById('led');
    const mainWhl = document.getElementById('mainWhl');
    const railL = document.getElementById('railL');
    const railR = document.getElementById('railR');
    let cur = 1, moving = false;

    function init() {
        const out = document.getElementById('outUI');
        const ins = document.getElementById('inUI');
        
        for(let i=1; i<=6; i++) {
            const h = (i-1) * 120;
            // 动态生成立体支架
            railL.insertAdjacentHTML('beforeend', `<div class="bracket-3d" style="bottom:${h+60}px"></div>`);
            railR.insertAdjacentHTML('beforeend', `<div class="bracket-3d" style="bottom:${h+60}px"></div>`);

            out.innerHTML = `<div style="height:120px; display:flex; align-items:center;"><button onclick="to(${i})">${i}F</button></div>` + out.innerHTML;
            ins.insertAdjacentHTML('beforeend', `<button onclick="to(${i})" id="btn${i}">${i}</button>`);
        }
    }

    function to(f) {
        if(moving || f === cur) return;
        moving = true;
        const dir = f > cur ? 1 : -1;
        gate.classList.remove('open');
        document.getElementById(`btn${f}`).classList.add('active');

        // 轮盘旋转
        mainWhl.style.transform = `rotate(${dir * 720}deg)`;
        
        // 移动
        elv.style.bottom = (f-1) * 120 + "px";

        let step = cur;
        const timer = setInterval(() => {
            if(step !== f) {
                step += dir;
                led.innerText = step;
            } else {
                clearInterval(timer);
                cur = f;
                setTimeout(() => {
                    moving = false;
                    mainWhl.style.transform = `rotate(0deg)`;
                    document.getElementById(`btn${f}`).classList.remove('active');
                    gate.classList.add('open');
                }, 600);
            }
        }, 500);
    }

    init();
</script>
</body>
</html>
