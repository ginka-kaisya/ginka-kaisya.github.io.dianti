<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>工程级 3D 电梯机械仿真 - V3.0 动力增强版</title>
    <style>
        :root {
            --floor-h: 120px;
            --ind-yellow: #f1c40f; 
            --steel: #7f8c8d;
            --shaft-w: 400px;
            --shaft-d: 300px;
        }

        body {
            margin: 0; background: #080a0c; color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; perspective: 2000px;
        }

        .main-layout { 
            display: grid; 
            grid-template-columns: 200px 500px 200px; 
            gap: 20px; 
            align-items: center;
        }

        /* === 3D 场景核心 === */
        .scene-wrap {
            width: 100%; height: 750px; position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-20deg) rotateX(10deg);
            transition: transform 0.5s;
        }

        .shaft {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
            border: 2px solid #1a252f;
        }

        /* 井道壁 */
        .wall { position: absolute; background: rgba(20, 25, 30, 0.9); border: 1px solid #2c3e50; }
        .w-back { width: 100%; height: 100%; transform: translateZ(calc(var(--shaft-d) * -0.5)); }
        
        /* 导轨与支架 (图中: 导轨) */
        .rail {
            position: absolute; width: 8px; height: 100%; background: #444;
            left: 35px; transform: translateZ(0); box-shadow: 2px 0 5px #000;
        }
        .rail-r { left: auto; right: 35px; }
        .bracket {
            position: absolute; width: 40px; height: 10px; background: #222;
            left: 0; border: 1px solid #333;
        }

        /* === 轿厢系统 (图中: 轿厢) === */
        .car-sys {
            position: absolute; bottom: 0; left: 60px; width: 280px; height: 140px;
            transform-style: preserve-3d; transition: bottom 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 轿顶细节 (图中: 平层传感器、上横梁) */
        .car-top {
            position: absolute; top: -30px; width: 100%; height: 30px;
            background: #34495e; transform-style: preserve-3d;
            border: 1px solid #444;
        }
        
        /* 检修盒 (图中轿顶方盒) */
        .insp-box {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 15px; background: #f1c40f; border: 1px solid #000;
        }

        /* 平层感应器 (图中: 平层传感器) */
        .sensor-unit {
            position: absolute; top: -45px; right: 20px; width: 40px; height: 35px;
            background: #111; border: 2px solid var(--ind-yellow);
        }

        /* 轿体 */
        .car-body { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }
        .face { position: absolute; border: 1px solid #555; background: #bdc3c7; }
        .f-front { width: 100%; height: 100%; transform: translateZ(70px); background: rgba(236, 240, 241, 0.1); overflow: hidden; }
        .f-back { width: 100%; height: 100%; transform: translateZ(-70px); }
        .f-side { width: 140px; height: 100%; transform: rotateY(90deg) translateZ(-70px); }
        .f-side-r { width: 140px; height: 100%; transform: rotateY(-90deg) translateZ(-210px); }

        .door { width: 50%; height: 100%; background: linear-gradient(90deg, #7f8c8d, #eee, #7f8c8d); border: 1px solid #34495e; transition: 1s; }
        .open .d-l { transform: translateX(-100%); }
        .open .d-r { transform: translateX(100%); }

        /* === 对重系统 === */
        .cw-sys {
            position: absolute; top: 0; right: 10px; width: 40px; height: 180px;
            background: #222; border: 2px solid #444;
            transform: translateZ(-100px);
            transition: top 2.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; padding-top: 5px;
        }
        .weight-block { width: 30px; height: 12px; background: #111; margin-bottom: 2px; border: 1px solid #333; }

        /* 动态钢丝绳 */
        .rope-svg {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            pointer-events: none; transform: translateZ(0);
        }

        /* === 控制面板 === */
        .panel { background: #1a1d23; padding: 20px; border-radius: 10px; border: 1px solid #34495e; }
        .screen { background: #000; color: #ff4757; font-family: 'Courier New', monospace; font-size: 30px; text-align: center; padding: 10px; margin-bottom: 15px; border: 2px solid #333; }
        
        .btn-call { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: #888; font-size: 12px; }
        button { background: #2f3542; color: #fff; border: 1px solid #57606f; padding: 8px; cursor: pointer; transition: 0.3s; border-radius: 4px; }
        button:hover { background: #546de5; }
        button.active { background: #f1c40f; color: #000; box-shadow: 0 0 10px #f1c40f; }

        .xray .face { background: rgba(189, 195, 199, 0.1) !important; border: 1px dashed #555; }
        
        /* 标签标注 */
        .label { position: absolute; font-size: 11px; color: var(--ind-yellow); border-left: 2px solid var(--ind-yellow); padding-left: 5px; pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body class="">

<div class="main-layout">
    <div class="controls">
        <div class="panel">
            <div style="font-size: 11px; color: #57606f; margin-bottom: 10px;">外呼系统 / EXTERNAL</div>
            <div id="extButtons"></div>
            <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
            <button onclick="toggleXray()" style="width: 100%; font-size: 12px;">切换透视模式</button>
            <div style="margin-top:10px;">
                <input type="range" style="width:100%" min="-60" max="60" value="-20" oninput="rotateScene(this.value)">
            </div>
        </div>
    </div>

    <div class="scene-wrap" id="scene">
        <div class="shaft">
            <div class="wall w-back"></div>
            
            <div class="rail"></div>
            <div class="rail rail-r" id="railR"></div>
            <div id="brackets"></div>

            <svg class="rope-svg">
                <line id="ropeCar" x1="140" y1="0" x2="140" y2="600" stroke="#555" stroke-width="2" />
                <line id="ropeCw" x1="375" y1="0" x2="375" y2="150" stroke="#777" stroke-width="2" />
            </svg>

            <div class="car-sys" id="carSys">
                <div class="car-top">
                    <div class="insp-box"></div>
                    <div class="sensor-unit"></div>
                    <div class="label" style="top: -50px; right: -80px;">平层传感器 (磁感应)</div>
                </div>
                <div class="car-body">
                    <div class="face f-back"></div>
                    <div class="face f-side"></div>
                    <div class="face f-side-r"></div>
                    <div class="face f-front" id="doors">
                        <div style="display: flex; height: 100%;">
                            <div class="door d-l"></div>
                            <div class="door d-r"></div>
                        </div>
                    </div>
                </div>
                <div class="label" style="bottom: 20px; left: -80px;">轿厢主体</div>
            </div>

            <div class="cw-sys" id="cwSys">
                <div class="weight-block"></div><div class="weight-block"></div>
                <div class="weight-block"></div><div class="weight-block"></div>
                <div class="weight-block"></div><div class="weight-block"></div>
                <div class="label" style="top: 0; right: -50px;">对重装置</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="panel">
            <div class="screen" id="floorDisplay">1</div>
            <div id="intButtons" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
        </div>
    </div>
</div>

<script>
    const carSys = document.getElementById('carSys');
    const cwSys = document.getElementById('cwSys');
    const floorDisplay = document.getElementById('floorDisplay');
    const doors = document.getElementById('doors');
    const ropeCar = document.getElementById('ropeCar');
    const ropeCw = document.getElementById('ropeCw');
    
    let curFloor = 1, isMoving = false;
    const FLOORS = 6;
    const HEIGHT = 120;

    function init() {
        const ext = document.getElementById('extButtons');
        const ins = document.getElementById('intButtons');
        const brackets = document.getElementById('brackets');
        const railR = document.getElementById('railR');

        for(let i=FLOORS; i>=1; i--) {
            // 外呼
            ext.innerHTML += `<div class="btn-call">F${i} <button onclick="goTo(${i})" id="ebtn${i}">CALL</button></div>`;
            // 内选
            ins.insertAdjacentHTML('afterbegin', `<button onclick="goTo(${i})" id="ibtn${i}">${i}</button>`);
            
            // 导轨支架与磁铁
            brackets.innerHTML += `<div class="bracket" style="bottom:${(i-1)*HEIGHT}px"></div>`;
            railR.innerHTML += `<div style="position:absolute; width:10px; height:30px; background:#e74c3c; bottom:${(i-1)*HEIGHT + 65}px; right:-10px; border:1px solid #000;"></div>`;
        }
        updateRopes(1);
    }

    function rotateScene(val) {
        document.getElementById('scene').style.transform = `rotateY(${val}deg) rotateX(10deg)`;
    }

    function toggleXray() {
        document.body.classList.toggle('xray');
    }

    function updateRopes(f) {
        const carY = 750 - ((f-1) * HEIGHT + 170);
        const cwY = (f-1) * HEIGHT + 10;
        ropeCar.setAttribute('y2', carY);
        ropeCw.setAttribute('y2', cwY);
    }

    function goTo(f) {
        if(isMoving || f === curFloor) return;
        isMoving = true;
        
        doors.classList.remove('open');
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.getElementById(`ibtn${f}`).classList.add('active');
        document.getElementById(`ebtn${f}`).classList.add('active');

        // 运动
        carSys.style.bottom = (f-1) * HEIGHT + "px";
        cwSys.style.top = (f-1) * HEIGHT + "px";

        // 绳索动画同步
        let start = Date.now();
        const duration = 2500;
        const startF = curFloor;
        
        const animate = () => {
            let elapsed = Date.now() - start;
            let progress = Math.min(elapsed / duration, 1);
            // 缓动函数
            let ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            let currentF = startF + (f - startF) * ease;
            updateRopes(currentF);
            
            if(progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);

        // 楼层变化
        let step = curFloor;
        const dir = f > curFloor ? 1 : -1;
        const timer = setInterval(() => {
            if(step !== f) {
                step += dir;
                floorDisplay.innerText = step;
            } else {
                clearInterval(timer);
                curFloor = f;
                setTimeout(() => {
                    isMoving = false;
                    doors.classList.add('open');
                }, 600);
            }
        }, 400);
    }

    init();
</script>
</body>
</html>
