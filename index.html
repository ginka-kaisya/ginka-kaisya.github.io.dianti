<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>高精工业 CAD 电梯仿真控制系统 - 内部亮化增强版</title>
    <style>
        :root {
            --floor-h: 120px;
            --ind-yellow: #f39c12; 
            --brushed-steel: linear-gradient(180deg, #bdc3c7 0%, #ffffff 50%, #bdc3c7 100%);
            /* 修正：大幅提升内部亮度，使用暖白光模拟灯照 */
            --cabin-light: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%);
        }

        body {
            margin: 0; background: #121416; color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden;
        }

        .app-container { display: flex; gap: 60px; align-items: center; perspective: 3000px; }

        .scene-3d {
            width: 320px; height: 740px; position: relative;
            transform-style: preserve-3d; transform: rotateY(-20deg) rotateX(8deg);
        }

        .shaft {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
            border: 2px solid #333; background: rgba(255,255,255,0.02);
        }

        /* 外部机械结构保持不变 */
        .rail { position: absolute; width: 4px; height: 100%; background: #444; left: 15px; transform: translateZ(30px); }
        .rail.right { left: auto; right: 15px; }
        .machine-room { position: absolute; top: -60px; left: 0; width: 100%; height: 60px; background: #1a1a1a; border: 2px solid #333; transform: translateZ(40px); }
        .pulley { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, #bbb, #555); top: 10px; left: 60px; border: 3px solid #222; }
        .pulley.right { left: auto; right: 60px; }
        .cable { position: absolute; width: 3px; height: 100%; background: linear-gradient(#aaa, #666); top: 0; transform: translateZ(35px); }
        .cable.left { left: 78px; } .cable.right { right: 78px; }

        .elevator-group {
            position: absolute; bottom: 0; left: 50px; width: 220px; height: 110px;
            transform-style: preserve-3d; transition: bottom 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .car-frame-vertical {
            position: absolute; width: 6px; height: 130%; top: -15%;
            background: var(--ind-yellow); transform: translateZ(55px);
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        .v-left { left: -5px; } .v-right { right: -5px; }

        .car-box {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
        }

        .face {
            position: absolute; 
            border: 1px solid #999;
            box-sizing: border-box;
            backface-visibility: hidden;
        }

        /* =============================
            内部装饰及亮度修正
        ============================== */

        /* 1. 后壁：高亮拉丝不锈钢 */
        .f-back { 
            width: 100%; height: 100%;
            transform: translateZ(-80px);
            background: var(--brushed-steel);
            box-shadow: inset 0 0 50px rgba(255,255,255,0.8);
            display: flex; justify-content: center; align-items: center;
        }
        .f-back::after { content: ""; position: absolute; top: 60%; width: 100%; height: 5px; background: #666; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        /* 2. 左侧墙（含控制面板）：修正黑色，改为明亮的浅金属色并加径向光晕 */
        .f-left { 
            width: 130px; height: 100%;
            transform: rotateY(-90deg) translateZ(65px);
            background: radial-gradient(ellipse at center, #ffffff 0%, #bdc3c7 100%); /* 核心修正：自发光背景 */
            display: flex; flex-direction: column; align-items: center; padding-top: 15px;
        }
        .inner-panel {
            width: 40px; height: 80px; background: #34495e; border: 2px solid #2c3e50;
            border-radius: 3px; display: grid; grid-template-columns: 1fr 1fr; 
            padding: 5px; gap: 5px; box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .i-btn { width: 12px; height: 12px; background: #ecf0f1; border-radius: 50%; box-shadow: inset 0 1px 2px #000; }
        .i-btn.active { background: #3498db; box-shadow: 0 0 8px #3498db, inset 0 1px 2px #000; }

        /* 3. 右侧墙：与左侧对称，保持高亮 */
        .f-right { 
            width: 130px; height: 100%;
            transform: rotateY(90deg) translateZ(155px);
            background: radial-gradient(ellipse at center, #ffffff 0%, #bdc3c7 100%);
        }

        /* 4. 天花板：修正黑色，改为纯白发光体 */
        .f-top { 
            width: 100%; height: 130px;
            transform: rotateX(90deg) translateZ(65px);
            background: #fff; /* 核心修正：直接使用白色背景 */
            box-shadow: 0 0 60px #fff;
            display: flex; justify-content: center; align-items: center;
        }
        .light-fixture {
            width: 80px; height: 60px; background: #fff;
            border: 2px solid #eee; box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 0 40px #fff;
        }

        /* 5. 地板 */
        .f-bottom { 
            width: 100%; height: 130px;
            transform: rotateX(-90deg) translateZ(45px);
            background: #546e7a;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.3);
        }

        /* 前框架与门 */
        .f-front { width: 100%; height: 100%; transform: translateZ(50px); border: 4px solid var(--ind-yellow); pointer-events: none; }
        .door-container { position: absolute; width: 100%; height: 100%; transform: translateZ(2px); overflow: hidden; display: flex; justify-content: center; pointer-events: auto; }
        .door-leaf { width: 49%; height: 100%; background: linear-gradient(90deg, #95a5a6, #ecf0f1, #95a5a6); border: 1px solid #7f8c8d; transition: transform 1.2s cubic-bezier(0.7, 0, 0.3, 1); }
        .doors-open .door-left { transform: translateX(-100%); }
        .doors-open .door-right { transform: translateX(100%); }

        /* 其他 UI */
        .cw { position: absolute; top: 0; right: 20px; width: 40px; height: 100px; background: linear-gradient(#27ae60, #1e8449); transform: translateZ(-30px); transition: top 2.5s; }
        .panel { background: #1c1f22; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .led { background: #000; color: #ff3e3e; font-size: 32px; text-align: center; margin-bottom: 20px; border: 2px solid #222; font-family: 'Courier New', monospace; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { width: 50px; height: 50px; cursor: pointer; background: #34495e; color: white; border: 1px solid #555; border-radius: 4px; font-weight: bold; }
        button:hover { background: #2c3e50; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="panel" id="outUI"></div>

    <div class="scene-3d">
        <div class="shaft">
            <div class="rail"></div>
            <div class="rail right"></div>
            <div class="machine-room"><div class="pulley"></div><div class="pulley right"></div></div>
            <div class="cable left"></div><div class="cable right"></div>

            <div class="elevator-group" id="elv">
                <div class="car-frame-vertical v-left"></div>
                <div class="car-frame-vertical v-right"></div>

                <div class="car-box">
                    <div class="face f-back"></div>
                    <div class="face f-left">
                        <div style="color:#2c3e50; font-size:10px; font-weight:bold; margin-bottom:5px;">CAD-SIM</div>
                        <div class="inner-panel">
                            <div class="i-btn"></div><div class="i-btn"></div>
                            <div class="i-btn active"></div><div class="i-btn"></div>
                            <div class="i-btn"></div><div class="i-btn"></div>
                            <div class="i-btn"></div><div class="i-btn"></div>
                        </div>
                    </div>
                    <div class="face f-right"></div>
                    <div class="face f-top">
                        <div class="light-fixture"></div>
                    </div>
                    <div class="face f-bottom"></div>
                    <div class="face f-front">
                        <div class="door-container" id="doorContainer">
                            <div class="door-leaf door-left"></div>
                            <div class="door-leaf door-right"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="cw" id="cw"></div>
        </div>
    </div>

    <div class="panel">
        <div class="led" id="led">1</div>
        <div class="btn-grid" id="inUI"></div>
    </div>
</div>

<script>
    const elv = document.getElementById('elv');
    const cw = document.getElementById('cw');
    const led = document.getElementById('led');
    const doors = document.getElementById('doorContainer');
    let cur = 1, moving = false;

    function init() {
        const out = document.getElementById('outUI');
        const ins = document.getElementById('inUI');
        for(let i=1; i<=6; i++) {
            out.innerHTML = `<div style="height:120px; display:flex; align-items:center;">
                <button onclick="to(${i})">${i}F</button>
            </div>` + out.innerHTML;
            ins.insertAdjacentHTML('afterbegin', `<button onclick="to(${i})">${i}</button>`);
        }
    }

    function to(f) {
        if(moving || f === cur) return;
        moving = true;
        doors.classList.remove('doors-open');

        elv.style.bottom = (f-1)*120 + "px";
        cw.style.top = (f-1)*120 + "px";

        let step = cur;
        const dir = f > cur ? 1 : -1;
        const timer = setInterval(() => {
            if(step !== f) {
                step += dir;
                led.innerText = step;
            } else {
                clearInterval(timer);
                cur = f;
                setTimeout(() => {
                    moving = false;
                    doors.classList.add('doors-open');
                    setTimeout(() => {
                        if(!moving) doors.classList.remove('doors-open');
                    }, 4000);
                }, 500);
            }
        }, 500);
    }
    init();
</script>
</body>
</html>
