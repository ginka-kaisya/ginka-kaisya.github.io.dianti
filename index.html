<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>工业级 CAD 电梯机械架构 - 动态精度版</title>
    <style>
        :root {
            --floor-h: 120px;
            --ind-yellow: #f1c40f; 
            --iron-grey: #34495e;
            --steel-blue: #2c3e50;
            --brushed-steel: linear-gradient(180deg, #bdc3c7 0%, #ffffff 50%, #bdc3c7 100%);
        }

        body {
            margin: 0; background: #0e1012; color: #fff;
            font-family: 'Consolas', 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden;
        }

        .app-container { display: flex; gap: 40px; align-items: center; perspective: 2500px; }

        /* === 3D 井道容器 === */
        .scene-3d {
            width: 360px; height: 760px; position: relative;
            transform-style: preserve-3d; transform: rotateY(-18deg) rotateX(5deg);
        }

        .shaft {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
            border: 2px solid #2c3e50; background: rgba(20, 24, 28, 0.9);
        }

        /* 导轨支架 (Rail Brackets) */
        .bracket {
            position: absolute; width: 40px; height: 4px; background: #222;
            left: 0; transform: translateZ(10px); border-right: 2px solid #444;
        }
        .bracket.right { left: auto; right: 0; border-right: none; border-left: 2px solid #444; }

        /* T 型导轨 */
        .rail { 
            position: absolute; width: 12px; height: 100%; 
            background: #444; left: 8px; transform: translateZ(20px);
            border-left: 2px solid #222; box-shadow: 2px 0 5px #000;
        }
        .rail.right { left: auto; right: 8px; }

        /* 厅门门头 */
        .landing-header {
            position: absolute; width: 100%; height: 25px;
            background: linear-gradient(to bottom, #111, #333);
            border-bottom: 2px solid var(--ind-yellow);
            transform: translateZ(60px); opacity: 0.8;
            display: flex; align-items: flex-end; justify-content: center;
            font-size: 9px; color: #888;
        }

        /* 机房机械组 */
        .machine-room { 
            position: absolute; top: -90px; width: 100%; height: 90px; 
            background: #111; border: 2px solid #333; transform: translateZ(40px); 
        }
        .traction-motor {
            position: absolute; width: 90px; height: 55px; background: #1a5276;
            left: 50%; top: 10px; transform: translateX(-50%); border-radius: 4px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        /* 旋转的曳引轮 */
        .main-sheave { 
            position: absolute; width: 60px; height: 60px; border-radius: 50%; 
            background: conic-gradient(#555 0deg 45deg, #222 45deg 90deg, #555 90deg 135deg, #222 135deg 180deg, #555 180deg 225deg, #222 225deg 270deg, #555 270deg 315deg, #222 315deg 360deg);
            top: 15px; left: 45px; border: 4px solid #000;
            transition: transform 0.5s linear;
        }
        .governor {
            position: absolute; width: 28px; height: 28px; border-radius: 50%;
            background: conic-gradient(#c0392b 0deg 90deg, #7b241c 90deg 180deg, #c0392b 180deg 270deg, #7b241c 270deg 360deg);
            top: 30px; right: 40px; border: 2px solid #000;
            transition: transform 0.5s linear;
        }

        /* 旋转动画控制 */
        .spinning-up { transform: rotate(360deg); }
        .spinning-down { transform: rotate(-360deg); }

        /* 随行电缆 (Traveling Cable) */
        .traveling-cable {
            position: absolute; width: 8px; height: 400px;
            background: #000; border-radius: 4px; left: 30px;
            transform-origin: top center; transition: all 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* === 龙门架结构增强 === */
        .elevator-group {
            position: absolute; bottom: 0; left: 55px; width: 210px; height: 115px;
            transform-style: preserve-3d; transition: bottom 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 导靴 (Guide Shoes) */
        .guide-shoe {
            position: absolute; width: 14px; height: 10px; background: #222;
            border: 1px solid #666; left: -10px;
        }
        .shoe-top { top: -12px; } .shoe-bottom { bottom: -12px; }
        .shoe-right { left: auto; right: -10px; }

        .sling-beam {
            position: absolute; width: 226px; height: 12px; left: -8px;
            background: #222; border: 1px solid var(--ind-yellow);
            transform: translateZ(55px);
        }
        .s-top { top: -12px; } .s-bottom { bottom: -12px; }
        
        .sling-upright {
            position: absolute; width: 10px; height: 140px; top: -12px;
            background: var(--ind-yellow); transform: translateZ(55px);
        }
        .u-left { left: -8px; } .u-right { right: -8px; }

        /* 轿厢内部 */
        .car-box { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }
        .face { position: absolute; border: 1px solid #aaa; box-sizing: border-box; }
        .f-back { width: 100%; height: 100%; transform: translateZ(-70px); background: var(--brushed-steel); box-shadow: inset 0 0 40px rgba(255,255,255,1); }
        .f-left, .f-right { width: 125px; height: 100%; background: radial-gradient(circle at center, #fff, #bdc3c7); }
        .f-left { transform: rotateY(-90deg) translateZ(62px); }
        .f-right { transform: rotateY(90deg) translateZ(148px); }
        .f-top { width: 100%; height: 125px; transform: rotateX(90deg) translateZ(62px); background: #fff; box-shadow: 0 0 50px #fff; }
        .f-bottom { width: 100%; height: 125px; transform: rotateX(-90deg) translateZ(53px); background: #34495e; }
        .f-front { width: 100%; height: 100%; transform: translateZ(55px); pointer-events: none; border: 2px solid #666; }

        .door-container { position: absolute; width: 100%; height: 100%; overflow: hidden; display: flex; transform: translateZ(1px); }
        .door-leaf { width: 50%; height: 100%; background: linear-gradient(90deg, #95a5a6, #eee, #95a5a6); border: 1px solid #7f8c8d; transition: transform 1.2s ease-in-out; }
        .doors-open .door-left { transform: translateX(-100%); }
        .doors-open .door-right { transform: translateX(100%); }

        /* 对重系统增强 */
        .cw-frame { 
            position: absolute; top: 0; right: 20px; width: 30px; height: 140px; 
            border: 3px solid #555; transform: translateZ(-20px); transition: top 2.5s;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; padding: 2px;
        }
        .weight-block { width: 100%; height: 8px; background: #222; margin-bottom: 2px; border-bottom: 1px solid #444; }

        /* UI */
        .panel { background: #1c1f22; padding: 20px; border-radius: 4px; border: 1px solid #444; }
        .led { background: #000; color: #00ff00; font-size: 28px; text-align: center; margin-bottom: 15px; border: 1px solid #333; font-family: 'Courier New'; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { width: 45px; height: 45px; cursor: pointer; background: #2c3e50; color: #bdc3c7; border: 1px solid #444; }
        button.active { border-color: var(--ind-yellow); color: var(--ind-yellow); box-shadow: 0 0 10px var(--ind-yellow); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="panel" id="outUI"></div>

    <div class="scene-3d">
        <div class="shaft" id="shaftBG">
            <div class="rail"></div><div class="rail right"></div>
            
            <div class="machine-room">
                <div class="traction-motor"></div>
                <div class="main-sheave" id="mainWheel"></div>
                <div class="governor" id="govWheel"></div>
            </div>

            <div class="traveling-cable" id="tCable"></div>

            <div class="elevator-group" id="elv">
                <div class="guide-shoe shoe-top"></div>
                <div class="guide-shoe shoe-top shoe-right"></div>
                <div class="guide-shoe shoe-bottom"></div>
                <div class="guide-shoe shoe-bottom shoe-right"></div>

                <div class="sling-beam s-top"></div>
                <div class="sling-upright u-left"></div>
                <div class="sling-upright u-right"></div>
                <div class="sling-beam s-bottom"></div>

                <div class="car-box">
                    <div class="face f-back"></div>
                    <div class="face f-left"></div>
                    <div class="face f-right"></div>
                    <div class="face f-top"></div>
                    <div class="face f-bottom"></div>
                    <div class="face f-front">
                        <div class="door-container" id="doorContainer">
                            <div class="door-leaf door-left"></div>
                            <div class="door-leaf door-right"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cw-frame" id="cw">
                <div class="weight-block"></div><div class="weight-block"></div>
                <div class="weight-block"></div><div class="weight-block"></div>
                <div class="weight-block"></div><div class="weight-block"></div>
                <div class="weight-block"></div><div class="weight-block"></div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="led" id="led">1</div>
        <div class="btn-grid" id="inUI"></div>
    </div>
</div>

<script>
    const elv = document.getElementById('elv');
    const cw = document.getElementById('cw');
    const led = document.getElementById('led');
    const doors = document.getElementById('doorContainer');
    const shaft = document.getElementById('shaftBG');
    const mainWheel = document.getElementById('mainWheel');
    const govWheel = document.getElementById('govWheel');
    const tCable = document.getElementById('tCable');
    
    let cur = 1, moving = false;

    function init() {
        const out = document.getElementById('outUI');
        const ins = document.getElementById('inUI');
        
        for(let i=1; i<=6; i++) {
            const floorPos = (i-1) * 120;
            
            // 插入导轨支架 (Brackets)
            shaft.insertAdjacentHTML('afterbegin', `
                <div class="bracket" style="bottom:${floorPos + 40}px"></div>
                <div class="bracket right" style="bottom:${floorPos + 40}px"></div>
                <div class="landing-header" style="bottom:${floorPos + 110}px">
                    SYS-REF: FL-${i} L-HEAD
                </div>
            `);
            
            out.innerHTML = `<div style="height:120px; display:flex; align-items:center;">
                <button onclick="to(${i})" id="outBtn${i}">${i}F</button>
            </div>` + out.innerHTML;
            ins.insertAdjacentHTML('afterbegin', `<button onclick="to(${i})" id="inBtn${i}">${i}</button>`);
        }
        updateCable(1);
    }

    function updateCable(f) {
        // 随行电缆模拟：一端固定在轿厢底部，一端固定在井道中部
        const pos = (f-1) * 120;
        tCable.style.height = (400 - pos/2) + "px";
        tCable.style.top = (760 - pos - (400 - pos/2)) + "px";
    }

    function to(f) {
        if(moving || f === cur) return;
        moving = true;
        
        const dir = f > cur ? 'up' : 'down';
        doors.classList.remove('doors-open');
        document.getElementById(`inBtn${f}`).classList.add('active');

        // 启动轮盘旋转动画
        mainWheel.classList.add(dir === 'up' ? 'spinning-up' : 'spinning-down');
        govWheel.classList.add(dir === 'up' ? 'spinning-up' : 'spinning-down');

        elv.style.bottom = (f-1)*120 + "px";
        cw.style.top = (f-1)*120 + "px";
        updateCable(f);

        let step = cur;
        const dNum = f > cur ? 1 : -1;
        const timer = setInterval(() => {
            if(step !== f) {
                step += dNum;
                led.innerText = step;
            } else {
                clearInterval(timer);
                cur = f;
                setTimeout(() => {
                    moving = false;
                    mainWheel.classList.remove('spinning-up', 'spinning-down');
                    govWheel.classList.remove('spinning-up', 'spinning-down');
                    document.getElementById(`inBtn${f}`).classList.remove('active');
                    doors.classList.add('doors-open');
                }, 500);
            }
        }, 500);
    }
    init();
</script>
</body>
</html>
